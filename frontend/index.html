<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="corvo. — the procurement intelligence engine."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <title>corvo. — Procurement Intelligence Engine</title>
    <style>
      html,
      body {
        margin: 0;
        background: #080b1f;
        color: #f5f3ec;
        font-family: Arial, sans-serif;
      }
      #startup {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #startup section {
        max-width: 440px;
        padding: 32px;
        border: 1px solid #b7b3d740;
        background: #141a4266;
      }
      #startup h1 {
        font-size: 32px;
        margin: 0 0 20px;
      }
      #startup p {
        line-height: 1.6;
        color: #b7b3d7;
      }
      #startup a {
        display: inline-block;
        background: #d7ff3f;
        color: #080b1f;
        padding: 12px 20px;
        text-decoration: none;
        margin-top: 12px;
      }
      #startup a[hidden] {
        display: none;
      }
    </style>
    <script>
      // This runs before module downloads: even a blocked or outdated bundle
      // gets a usable recovery screen, independently of React and its CSS.
      window.corvoBoot = { ready: false, failed: false };
      window.corvoBoot.fail = function () {
        if (window.corvoBoot.ready || window.corvoBoot.failed) return;
        window.corvoBoot.failed = true;
        var title = document.getElementById("startup-title"),
          message = document.getElementById("startup-message"),
          link = document.getElementById("startup-reload");
        if (title) title.textContent = "Let’s reload your workspace.";
        if (message)
          message.textContent =
            "The application files could not finish loading. Reload to get the latest version. Your saved procurement data is safe.";
        if (link) {
          var url = new URL(window.location.href);
          url.searchParams.set("reload", Date.now().toString());
          link.href = url.toString();
          link.hidden = false;
        }
      };
      window.addEventListener(
        "error",
        function (event) {
          if (event.target && event.target.tagName === "SCRIPT")
            window.corvoBoot.fail();
        },
        true,
      );
      window.addEventListener("unhandledrejection", function () {
        window.corvoBoot.fail();
      });
      window.setTimeout(function () {
        window.corvoBoot.fail();
      }, 20000);
    </script>
  </head>
  <body>
    <div id="root">
      <main id="startup" role="status">
        <section>
          <h1 id="startup-title">corvo.</h1>
          <p id="startup-message">Loading your procurement workspace…</p>
          <a id="startup-reload" href="/" hidden>Reload workspace</a>
        </section>
      </main>
    </div>
    <noscript
      ><p style="padding: 24px">
        Enable JavaScript to open the procurement workspace.
      </p></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

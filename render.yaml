services:
  - type: web
    name: corvo-procurement-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUYER_PASSWORD
        sync: false
      - key: REQUESTER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

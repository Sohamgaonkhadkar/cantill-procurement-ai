<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">Corvo Procurement OS</title><desc id="desc">Deterministic procurement with reviewed policy, source evidence and optional fictional-demo Gemini assistance.</desc><rect width="1200" height="280" rx="8" fill="#142128"/><path d="M48 45H100" stroke="#4678E8" stroke-width="4"/><text x="48" y="83" fill="#B8C8D0" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PROCUREMENT / POLICY / EVIDENCE</text><text x="45" y="159" fill="#F5F3EE" font-family="Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-3">corvo<tspan fill="#76A0F4">.</tspan></text><text x="49" y="201" fill="#D8DEDD" font-family="Arial,sans-serif" font-size="22">Every request. A reasoned decision.</text><text x="49" y="245" fill="#B8C8D0" font-family="Arial,sans-serif" font-size="13">DETERMINISTIC ENGINE · VERSIONED RULES · IMMUTABLE RUNS</text><g font-family="Arial,sans-serif" font-size="14" fill="#F5F3EE"><rect x="760" y="66" width="150" height="48" rx="4" fill="#17394B" stroke="#82929A"/><text x="782" y="95">Requirement</text><path d="M910 90H962V165H1010" fill="none" stroke="#76A0F4" stroke-width="2"/><rect x="1010" y="141" width="140" height="48" rx="4" fill="#17394B" stroke="#82929A"/><text x="1035" y="170">Decision</text><rect x="760" y="190" width="150" height="48" rx="4" fill="#17394B" stroke="#82929A"/><text x="782" y="219">Policy / Evidence</text><path d="M910 214H962V165" fill="none" stroke="#68B8B4" stroke-width="2"/></g></svg>